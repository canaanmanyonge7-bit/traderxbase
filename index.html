<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraderXBase</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#07101f;
 color:white;
}
header{
 background:#0d1b2f;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:24px;font-weight:bold}
.user{font-size:13px;color:#9db0c8}
.container{
 max-width:700px;
 margin:auto;
 padding:20px;
}
.card{
 background:#0d1b2f;
 border:1px solid #203452;
 border-radius:16px;
 padding:20px;
 margin-bottom:18px;
}
h1{margin-top:0}
.stat{
 display:flex;
 justify-content:space-between;
 padding:15px 0;
 border-bottom:1px solid #203452;
}
button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#16a34a;
 color:white;
 font-size:16px;
 font-weight:bold;
 margin-top:12px;
}
button.logout{background:#26364d}
input,select{
 width:100%;
 padding:13px;
 margin-top:8px;
 border-radius:9px;
 border:1px solid #344b68;
 background:#07101f;
 color:white;
}
.hidden{display:none}
.green{color:#22c55e}
</style>
</head>

<body>

<header>
<div class="logo">TraderXBase</div>
<div class="user" id="userEmail">Loading...</div>
</header>

<div class="container">

<div class="card">
<h1>Trading Dashboard</h1>
<p>Welcome to <b>TraderXBase</b>.</p>
<p class="green">● Account connected</p>
</div>

<div class="card">
<h2>Account Overview</h2>

<div class="stat">
<span>Account Status</span>
<b class="green">Active</b>
</div>

<div class="stat">
<span>Trading Mode</span>
<b>Demo</b>
</div>

<div class="stat">
<span>Bot Status</span>
<b id="botStatus">Stopped</b>
</div>

</div>

<div class="card">
<h2>Trading Bot</h2>

<label>Trading Market</label>
<select>
<option>Volatility Index</option>
<option>Forex</option>
<option>Crypto</option>
</select>

<label>Stake Amount</label>
<input type="number" placeholder="Enter amount">

<label>Strategy</label>
<select>
<option>TraderXBase Strategy</option>
<option>Conservative</option>
<option>Aggressive</option>
</select>

<button onclick="startBot()">START BOT</button>
<button class="logout" onclick="logout()">LOGOUT</button>
</div>

<div class="card">
<h2>Bot Information</h2>
<p>Trades: <b id="trades">0</b></p>
<p>Profit/Loss: <b id="profit">0.00</b></p>
</div>

</div>

<script>
function startBot(){
 document.getElementById("botStatus").innerText="Running";
 alert("TraderXBase demo bot started.");
}

function logout(){
 alert("Logout function will be connected to Supabase in the next step.");
}
</script>

</body>
</html>
