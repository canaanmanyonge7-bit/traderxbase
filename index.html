<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraderXBase</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #111b2e;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    input {
      background: #0b1220;
      color: white;
      border: 1px solid #34425b;
    }

    button {
      border: none;
      background: #16a34a;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    #dashboard {
      display: none;
      text-align: center;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="loginPage">
    <h1>TraderXBase</h1>

    <input id="email" type="email" placeholder="Email address">

    <input id="password" type="password" placeholder="Password">

    <button onclick="createAccount()">Create Account</button>

    <button onclick="login()">Login</button>

    <p id="message"></p>
  </div>

  <div id="dashboard">
    <h1>TraderXBase</h1>
    <p>Welcome!</p>
    <p id="userEmail"></p>

    <button onclick="logout()">Logout</button>
  </div>

</div>

<script>

const SUPABASE_URL = "https://niiuquwoulqjncziayir.supabase.co";

const SUPABASE_KEY = "sb_publishable_U_Mx6TQe-fKkfuqgGcYJKA_tWQUb1so";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function createAccount() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  if (!email || !password) {
    message.textContent = "Enter email and password.";
    return;
  }

  const { error } = await client.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent =
    "Account created. Check your email for verification.";
}


async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  const { data, error } =
    await client.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent = error.message;
    return;
  }

  showDashboard(data.user);
}


function showDashboard(user) {

  document.getElementById("loginPage").style.display = "none";

  document.getElementById("dashboard").style.display = "block";

  document.getElementById("userEmail").textContent =
    user.email;
}


async function logout() {

  await client.auth.signOut();

  document.getElementById("dashboard").style.display = "none";

  document.getElementById("loginPage").style.display = "block";
}


async function checkLogin() {

  const { data } = await client.auth.getSession();

  if (data.session) {
    showDashboard(data.session.user);
  }
}

checkLogin();

</script>

</body>
</html>
